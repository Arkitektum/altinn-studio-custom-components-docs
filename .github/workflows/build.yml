name: Build

on:
    pull_request:
        branches: ["main"]

jobs:
    build:
        name: Verify build
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            # ------------------------------
            # 1. Checkout repository
            # ------------------------------
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # ------------------------------
            # 2. Setup Node.js
            # ------------------------------
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24

            # ------------------------------
            # 3. Enable Corepack (Yarn 4)
            # ------------------------------
            - name: Enable Corepack
              run: corepack enable

            # ------------------------------
            # 4. Install dependencies
            # ------------------------------
            - name: Install dependencies
              run: yarn install --immutable

            # ------------------------------
            # 5. Lint
            # ------------------------------
            # The ESLint scanning workflow uploads its findings without failing on them, so this is what actually gates a PR.
            - name: Lint
              run: yarn lint

            - name: Check formatting
              run: yarn format:check

            # Webpack and jest both strip the types without checking them, so nothing else would catch a type error.
            - name: Typecheck
              run: yarn typecheck

            # ------------------------------
            # 6. Tests
            # ------------------------------
            - name: Run tests
              run: yarn test

            # ------------------------------
            # 7. Build the site
            # ------------------------------
            - name: Build
              run: yarn build
