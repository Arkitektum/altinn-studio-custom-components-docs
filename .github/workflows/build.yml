name: Build

on:
    pull_request:
        branches: ["main"]

jobs:
    build:
        name: Verify build
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            # ------------------------------
            # 1. Checkout repository
            # ------------------------------
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            # ------------------------------
            # 2. Setup Node.js
            # ------------------------------
            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24

            # ------------------------------
            # 3. Enable Corepack (Yarn 4)
            # ------------------------------
            - name: Enable Corepack
              run: corepack enable

            # ------------------------------
            # 4. Install dependencies
            # ------------------------------
            - name: Install dependencies
              run: yarn install --immutable

            # ------------------------------
            # 5. Lint
            # ------------------------------
            # The ESLint scanning workflow uploads its findings without failing on them, so this is what actually gates a PR.
            - name: Lint
              run: yarn lint

            - name: Check formatting
              run: yarn format:check

            # Webpack and jest both strip the types without checking them, so nothing else would catch a type error.
            - name: Typecheck
              run: yarn typecheck

            # ------------------------------
            # 6. Tests
            # ------------------------------
            - name: Run tests
              run: yarn test

            # ------------------------------
            # 7. Build the site
            # ------------------------------
            - name: Build
              run: yarn build
