name: Deploy

on:
    push:
        branches: ["main"]
    workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
    contents: read
    pages: write
    id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        name: Build site
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24

            - name: Enable Corepack
              run: corepack enable

            - name: Install dependencies
              run: yarn install --immutable

            # Gate the deployment on the same checks the Build workflow runs for pull requests. Without these, a direct
            # push to main — or a merge whose result nobody opened a PR against — publishes without ever being linted or
            # tested, since Build only runs on pull_request.
            - name: Lint
              run: yarn lint

            - name: Check formatting
              run: yarn format:check

            - name: Typecheck
              run: yarn typecheck

            - name: Run tests
              run: yarn test

            - name: Build
              run: yarn build

            - name: Configure Pages
              uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
              with:
                  path: docs

    deploy:
        name: Deploy to GitHub Pages
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
