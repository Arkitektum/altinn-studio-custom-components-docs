name: Deploy

on:
    push:
        branches: ["main"]
    workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
    contents: read
    pages: write
    id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        name: Build site
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24

            - name: Enable Corepack
              run: corepack enable

            - name: Install dependencies
              run: yarn install --immutable

            # Gate the deployment on the same checks the Build workflow runs for pull requests. Without these, a direct
            # push to main — or a merge whose result nobody opened a PR against — publishes without ever being linted or
            # tested, since Build only runs on pull_request.
            - name: Lint
              run: yarn lint

            - name: Check formatting
              run: yarn format:check

            - name: Typecheck
              run: yarn typecheck

            - name: Run tests
              run: yarn test

            - name: Build
              run: yarn build

            - name: Configure Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: docs

    deploy:
        name: Deploy to GitHub Pages
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
